<section id="services" class="py-20 bg-background">
  <div class="site-container px-4">
    <div class="reveal text-center mb-16">
      <h2 class="text-3xl md:text-4xl font-bold text-primary mb-4">Our Services</h2>
      <p class="text-muted-foreground max-w-2xl mx-auto">
        Comprehensive accounting solutions tailored to your unique needs
      </p>
    </div>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      {% for service in services %}
        <div class="reveal group p-8 bg-card rounded-xl border border-border hover:border-accent/50 hover:shadow-lg hover:shadow-accent/5 transition-all duration-300" style="--reveal-delay: {{ service.delay }}s">
          <div class="w-14 h-14 mb-6 rounded-lg bg-accent/10 flex items-center justify-center group-hover:bg-accent/20 transition-colors">
            {% include "icons/"|add:service.icon|add:".svg" with cls="w-7 h-7 text-primary" %}
          </div>
          <h3 class="text-xl font-semibold text-primary mb-3">{{ service.title }}</h3>
          <p class="text-muted-foreground leading-relaxed">{{ service.description }}</p>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
